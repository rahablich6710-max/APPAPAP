services:
  - type: web
    name: scan-review
    runtime: node
    plan: starter
    buildCommand: echo "no build needed"
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: DATA_DIR
        value: /data
    disk:
      name: scan-review-data
      mountPath: /data
      sizeGB: 1
